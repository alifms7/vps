
name: Windows Cloud RDP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check runner
        run: |
          Write-Host "GitHub Actions runner is working."
          Write-Host "Operating system:"
          Get-ComputerInfo | Select-Object WindowsProductName

      - name: Check Tailscale secret
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            Write-Error "TAILSCALE_AUTHKEY is missing."
            exit 1
          }
          Write-Host "Tailscale secret is configured."
